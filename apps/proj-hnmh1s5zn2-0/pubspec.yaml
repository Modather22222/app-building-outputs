name: acoustic_soundboard
description: >-
  An offline Flutter soundboard with a tappable grid of synthesized funny
  effects, lo-fi beats, and ambient rain sounds played via audioplayers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  audioplayers: ^6.1.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
